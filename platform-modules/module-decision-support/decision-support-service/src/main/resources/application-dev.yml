server:
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  tomcat:
    max-connections: 2000
    accept-count: 2000

spring:
  aop:
    proxy-target-class: true
  application:
    name: diff-checker
  data:
    redis:
      host: 192.168.200.18
      port: 6379
      password: lilishop
      lettuce:
        pool:
          # 连接池最大连接数（使用负值表示没有限制） 默认 8
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认 -1
          max-wait: 20
          # 连接池中的最大空闲连接 默认 8
          max-idle: 10
          # 连接池中的最小空闲连接 默认 8
          min-idle: 8
  ai:
    openai:
      api-key: 1111          # 从环境变量读取
      base-url: http://192.168.200.53:8000    # 国内可替换为代理地址
      chat:
        options:
          model: Qwen/Qwen3-14B-AWQ
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
  datasource:
    frorcl:
      jdbc-url: jdbc:oracle:thin:@192.168.200.159:1521:frorcl
      driver-class-name: oracle.jdbc.OracleDriver
      username: dy
      password: dy
      # 主数据源的HikariCP配置
      hikari:
        pool-name: frorclPool
        minimum-idle: 3                    # 主库连接数较大
        maximum-pool-size: 10               # 主库最大连接数
        auto-commit: true
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 30000
        connection-test-query: SELECT 1 FROM DUAL





  jpa:
    # ✅ 推荐：禁用 Open Session In View
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true



