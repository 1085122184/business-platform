server:
  port: 18080
  servlet:
    context-path: /
  tomcat:
    max-connections: 2000
    accept-count: 2000

spring:
  profiles:
    active: dev  # 默认使用开发环境
  application:
    name: diff-checker
# 日志配置
logging:
  level:
    root: INFO
    dongyue.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api.log
# Springdoc OpenAPI配置（Swagger）
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
