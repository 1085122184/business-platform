server:
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  tomcat:
    max-connections: 2000
    accept-count: 2000

spring:
  application:
    name: diff-checker
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 200
          max-wait: 20
          max-idle: 10
          min-idle: 8
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:111}
      base-url: ${OPENAI_BASE_URL:http://192.168.200.53:8000}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:Qwen/Qwen3-14B-AWQ}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.7}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  datasource:
    frorcl:
      jdbc-url: ${FRORCL_JDBC_URL}
      driver-class-name: ${FRORCL_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
      username: ${FRORCL_USERNAME}
      password: ${FRORCL_PASSWORD}
      hikari:
        pool-name: frorclPool
        minimum-idle: 3
        maximum-pool-size: 10
        auto-commit: true
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 30000
        connection-test-query: SELECT 1 FROM DUAL

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

app:
  database:
    schema: ${FRORCL_SCHEMA}
  ding-talk:
    corpId: ${DINGTALK_CORP_ID:}
    userId: ${DINGTALK_USER_ID:}
    agentId: ${DINGTALK_AGENT_ID:}
    appKey: ${DINGTALK_APP_KEY:}
    appSecret: ${DINGTALK_APP_SECRET:}
    appId: ${DINGTALK_APP_ID:}
    scanAppSecret: ${DINGTALK_SCAN_APP_SECRET:}
    oauthRedirectUri: ${DINGTALK_OAUTH_REDIRECT_URI:http://192.168.200.40/login}
