spring:
  application:
    name: diff-checker
  data:
    redis:
      host: 192.168.200.18
      port: 6379
      password: lilishop
      lettuce:
        pool:
          # 连接池最大连接数（使用负值表示没有限制） 默认 8
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认 -1
          max-wait: 20
