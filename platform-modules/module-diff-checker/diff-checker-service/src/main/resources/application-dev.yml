          # 连接池中的最小空闲连接 默认 8
          min-idle: 8
  datasource:
    bip:
      jdbc-url: jdbc:oracle:thin:@192.168.73.4:1521:bipyjgtest
      driver-class-name: oracle.jdbc.OracleDriver
      username: DYYJGBIP6
      password: DYYJGBIP6
      # 主数据源的HikariCP配置
