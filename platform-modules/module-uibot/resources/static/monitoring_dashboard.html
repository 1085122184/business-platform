<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务队列监控面板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .icon-pending { background: #fef3c7; }
        .icon-running { background: #dbeafe; }
        .icon-completed { background: #d1fae5; }
        .icon-failed { background: #fee2e2; }
        .icon-queue { background: #e0e7ff; }

        .chart-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .task-list {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .task-list h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .task-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f9fafb;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .task-meta {
            font-size: 12px;
            color: #666;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-running { background: #dbeafe; color: #1e40af; }
        .status-queued { background: #e0e7ff; color: #3730a3; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-failed { background: #fee2e2; color: #991b1b; }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 任务队列监控面板</h1>
            <p>实时监控任务执行状态和系统性能</p>
            <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-queue">📊</div>
                <div class="stat-label">总队列大小</div>
                <div class="stat-value" id="queueSize">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-pending">⚡</div>
                <div class="stat-label">优先级队列</div>
                <div class="stat-value" id="priorityQueueSize">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-pending">📋</div>
                <div class="stat-label">普通队列</div>
                <div class="stat-value" id="normalQueueSize">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-running">⚡</div>
                <div class="stat-label">执行中</div>
                <div class="stat-value" id="runningCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-completed">✅</div>
                <div class="stat-label">已完成</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-failed">❌</div>
                <div class="stat-label">失败</div>
                <div class="stat-value" id="failedCount">0</div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-card">
                <h3>📈 任务状态分布</h3>
                <canvas id="statusChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>📊 任务趋势</h3>
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="task-list">
            <h3>📋 当前执行任务</h3>
            <div id="currentTask" class="empty-state">暂无任务执行</div>
        </div>

        <div class="task-list">
            <h3>⏳ 队列中的任务</h3>
            <div id="queuedTasks" class="empty-state">队列为空</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:18089/api';
        let statusChart, trendChart;

        // 初始化图表
        function initCharts() {
            // 状态分布饼图
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['待处理', '队列中', '执行中', '已完成', '失败'],
                    datasets: [{
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: ['#fbbf24', '#818cf8', '#60a5fa', '#34d399', '#f87171']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            // 趋势折线图
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '完成任务数',
                        data: [],
                        borderColor: '#34d399',
                        backgroundColor: 'rgba(52, 211, 153, 0.1)',
                        tension: 0.4
                    }, {
                        label: '失败任务数',
                        data: [],
                        borderColor: '#f87171',
                        backgroundColor: 'rgba(248, 113, 113, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // 获取系统统计
        async function fetchStats() {
            try {
                const response = await fetch(`${API_BASE}/monitor/stats`);
                const stats = await response.json();
                
                document.getElementById('queueSize').textContent = stats.queueSize || 0;
                document.getElementById('priorityQueueSize').textContent = stats.priorityQueueSize || 0;
                document.getElementById('normalQueueSize').textContent = stats.normalQueueSize || 0;
                document.getElementById('runningCount').textContent = stats.runningCount || 0;
                document.getElementById('completedCount').textContent = stats.completedCount || 0;
                document.getElementById('failedCount').textContent = stats.failedCount || 0;

                // 更新状态图表
                statusChart.data.datasets[0].data = [
                    stats.pendingCount || 0,
                    stats.queuedCount || 0,
                    stats.runningCount || 0,
                    stats.completedCount || 0,
                    stats.failedCount || 0
                ];
                statusChart.update();

            } catch (error) {
                console.error('获取统计数据失败:', error);
            }
        }

        // 获取当前执行任务
        async function fetchCurrentTask() {
            try {
                const response = await fetch(`${API_BASE}/monitor/current`);
                const task = await response.json();
                
                const container = document.getElementById('currentTask');
                if (task && task.taskId) {
                    container.innerHTML = `
                        <div class="task-item">
                            <div class="task-info">
                                <div class="task-name">${task.taskName}</div>
                                <div class="task-meta">
                                    ID: ${task.taskId} | 
                                    队列类型: ${task.queueType === 'PRIORITY' ? '优先级' : '普通'} |
                                    优先级: ${task.priority} | 
                                    开始时间: ${new Date(task.startedAt).toLocaleString()}
                                </div>
                            </div>
                            <span class="status-badge status-running">执行中</span>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div class="empty-state">暂无任务执行</div>';
                }
            } catch (error) {
                console.error('获取当前任务失败:', error);
            }
        }

        // 获取队列任务
        async function fetchQueuedTasks() {
            try {
                const response = await fetch(`${API_BASE}/tasks?status=QUEUED&size=10`);
                const data = await response.json();
                
                const container = document.getElementById('queuedTasks');
                if (data.content && data.content.length > 0) {
                    container.innerHTML = data.content.map((task, index) => `
                        <div class="task-item">
                            <div class="task-info">
                                <div class="task-name">#${index + 1} ${task.taskName}</div>
                                <div class="task-meta">
                                    ID: ${task.taskId} | 
                                    队列: ${task.queueType === 'PRIORITY' ? '优先级' : '普通'} |
                                    优先级: ${task.priority} | 
                                    创建时间: ${new Date(task.createTime).toLocaleString()}
                                </div>
                            </div>
                            <span class="status-badge status-queued">队列中</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty-state">队列为空</div>';
                }
            } catch (error) {
                console.error('获取队列任务失败:', error);
            }
        }

        // 刷新所有数据
        async function refreshData() {
            await Promise.all([
                fetchStats(),
                fetchCurrentTask(),
                fetchQueuedTasks()
            ]);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            refreshData();
            
            // 每5秒自动刷新
            setInterval(refreshData, 5000);
        });
    </script>
</body>
</html>
