# 日志配置
logging:
  level:
    root: INFO
    dongyue.api : DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api.log
# Springdoc OpenAPI配置（Swagger）
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
# 自定义配置
app:
  ding-talk:
    agentId: dingach805kwwt9h3oyg
    appSecret: TUL4_gPHWeM4rZWxRq6E4Llx1fe5vndqez9GzffkCpqwb3oJtcWCeRGyhu6FPSDl

  task-queue:
    # 任务超时监控配置
    timeout:
      enabled: true
      check-interval: 60000  # 检查间隔（毫秒）
      default-timeout: 300   # 默认超时时间（秒）

    # 任务清理配置
    cleanup:
      enabled: true
      schedule: "0 0 2 * * ?"  # 每天凌晨2点执行
      retention-days: 30       # 保留天数

    # 队列配置
    queue:
      initial-capacity: 100

    # 监控配置
    monitor:
      enabled: true
      dashboard-path: /dashboard.html
  trigger:
    master:
      url: http://127.0.0.1:18088
      path:
        start: /uiBot/


