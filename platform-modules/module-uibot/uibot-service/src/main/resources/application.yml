  jpa:
    # ✅ 推荐：禁用 Open Session In View
    open-in-view: false
#    database-platform: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.MySQL8Dialect  # MySQL生产环境
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
        errorDecoder: com.example.feign.config.CustomErrorDecoder
      uiBot-service:
        connectTimeout: 3000
        readTimeout: 10000
        loggerLevel: full
  api:
    #启用异步模式
    enableAsyncMode: false
    #启用严格顺序模式
    enableStrictOrder: true
    #最大等待时间（毫秒）
    maxWaitTime: 3600000
    maxRetries: 3
    timeout: 300000
    test:
      url: http://192.168.200.67:18088
#      url: http://127.0.0.1:18089

