ai:
  common:
    enabled: true
    provider: openai          # openai | ollama

    chat:
      system-prompt: "You are a helpful assistant. Please respond in the same language as the user."
      temperature: 0.7
      max-tokens: 2048
      memory-enabled: true
      memory-window-size: 10

    rag:
      top-k: 5
      similarity-threshold: 0.7
      chunk-size: 800
      chunk-overlap: 100

    log:
      log-request: false      # 生产环境建议关闭
      log-response: false

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}          # 从环境变量读取
      base-url: https://api.openai.com    # 国内可替换为代理地址
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small