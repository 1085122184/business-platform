stages:
  - build
  - deploy

variables:
  DEPLOY_DIR: "/home/dyroot/workspace/data_analysis"

build_backend:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  tags:
    - prod-deploy
  script:
    - mvn -pl platform-modules/module-decision-support/decision-support-service -am -DskipTests package
    - mkdir -p release
    - cp platform-modules/module-decision-support/decision-support-service/target/decision-support-service-*.jar release/app.jar
  artifacts:
    paths:
      - release/app.jar
    expire_in: 1 day

deploy_backend:
  stage: deploy
  image: alpine:3.20
  tags:
    - prod-deploy
  needs:
    - build_backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "auth_branch"'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - chmod 400 "$DEPLOY_SSH_PRIVATE_KEY"
    - ssh-add "$DEPLOY_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - scp -P "${DEPLOY_PORT:-22}" release/app.jar "$DEPLOY_USER@$DEPLOY_HOST:/tmp/data-analysis-app.jar"
    - |
      ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        DEPLOY_DIR='$DEPLOY_DIR'
        mkdir -p \"\$DEPLOY_DIR/backend\"
        mv /tmp/data-analysis-app.jar \"\$DEPLOY_DIR/backend/app.jar\"
        cd \"\$DEPLOY_DIR\"
        docker compose up -d --build backend
        docker image prune -f
      "
