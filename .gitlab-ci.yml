stages:
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -DskipTests -DskipITs -Dmaven.artifact.threads=1"

cache:
  key: "maven-${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

.deploy_backend_template:
  stage: deploy
  resource_group: backend-deploy-$CI_COMMIT_REF_SLUG
  image:
    name: maven:3.9.9-eclipse-temurin-17
    pull_policy: if-not-present
  tags:
    - prod-deploy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client && rm -rf /var/lib/apt/lists/*
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_DIR"
    - test -n "$DEPLOY_SSH_PRIVATE_KEY"
    - echo "Deploy target ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT:-22}, dir=${DEPLOY_DIR}"
    - eval "$(ssh-agent -s)"
    - chmod 400 "$DEPLOY_SSH_PRIVATE_KEY"
    - ssh-add "$DEPLOY_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - mvn -s ci/settings-ci.xml $MAVEN_CLI_OPTS -pl :decision-support-service -am package
    - mkdir -p release
    - cp platform-modules/module-decision-support/decision-support-service/target/decision-support-service-*.jar release/app.jar
    - scp -P "${DEPLOY_PORT:-22}" release/app.jar "$DEPLOY_USER@$DEPLOY_HOST:/tmp/data-analysis-app.jar"
    - |
      ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        DEPLOY_DIR='$DEPLOY_DIR'
        mkdir -p \"\$DEPLOY_DIR/backend\"
        mv /tmp/data-analysis-app.jar \"\$DEPLOY_DIR/backend/app.jar\"
        cd \"\$DEPLOY_DIR\"
        docker compose up -d --build backend
        docker image prune -f
      "

deploy_backend_auth_53:
  extends: .deploy_backend_template
  variables:
    DEPLOY_HOST: "192.168.200.53"
    DEPLOY_PORT: "22"
    DEPLOY_USER: "dyroot"
    DEPLOY_DIR: "/home/dyroot/workspace/data_analysis"
  rules:
    - if: '$CI_COMMIT_BRANCH == "auth_branch"'
      when: manual
  environment:
    name: auth-prod-53

deploy_backend_auth_40:
  extends: .deploy_backend_template
  variables:
    DEPLOY_HOST: "192.168.200.40"
    DEPLOY_PORT: "22"
    DEPLOY_USER: "root"
    DEPLOY_DIR: "/home/workspace/data_analysis"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: auth-prod-40
